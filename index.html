
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELIO | Elevating Brands in the UAE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
      background-color: #050505;
      color: #ffffff;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gradient-text {
      background: linear-gradient(135deg, #ff9d00 0%, #ff5e00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .helios-glow {
      box-shadow: 0 0 50px rgba(255, 157, 0, 0.15);
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    @keyframes logo-pulse {
      0%, 100% { 
        transform: scale(1); 
        filter: drop-shadow(0 0 0px rgba(249, 115, 22, 0));
        opacity: 0.9;
      }
      50% { 
        transform: scale(1.04); 
        filter: drop-shadow(0 0 25px rgba(249, 115, 22, 0.4));
        opacity: 1;
      }
    }
    .animate-pulse-slow {
      animation: pulse-slow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .animate-logo-pulse {
      animation: logo-pulse 4s ease-in-out infinite;
    }
  </style>
<script type="importmap">

  }
}
</script>
</head>

</body>
</html>
